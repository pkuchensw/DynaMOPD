[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamopd"
version = "0.1.0"
description = "Synchronous multi-teacher on-policy distillation with elastic GPU groups"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[project.optional-dependencies]
gpu = [
    "torch>=2.9,<2.10",
    "transformers>=5.3,<5.4",
    "sglang==0.5.10.post1",
    "nvidia-ml-py",
    "requests",
]
cluster = ["ray>=2.54,<3"]
packed = ["flash-attn==2.8.1"]
parquet = ["pyarrow"]
calibration = ["numpy", "scipy"]

wandb = ["wandb>=0.18"]
swanlab = ["swanlab>=0.6"]

[project.scripts]
dynamopd = "DynaMOPD.run:main"
dynamopd-timeline = "DynaMOPD.tools.timeline:main"

[tool.setuptools]
package-dir = {"DynaMOPD" = "."}
include-package-data = false
packages = [
    "DynaMOPD", "DynaMOPD.algorithms", "DynaMOPD.backends",
    "DynaMOPD.backends.hf_reference", "DynaMOPD.cluster", "DynaMOPD.scheduler",
    "DynaMOPD.trainer", "DynaMOPD.workers", "DynaMOPD.tools", "DynaMOPD.tools.baselines", "DynaMOPD.utils",
]

[tool.setuptools.package-data]
DynaMOPD = ["NOTICE", "configs/*.json", "data/native-smoke.jsonl", "data/smoke.jsonl", "launch.sh", "examples/*.sh", "licenses/*.txt", "licenses/*.md"]
"DynaMOPD.tools" = ["paper_report.template.html", "scenario_timeline.template.html", "timeline.html"]
